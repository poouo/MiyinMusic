name: Android Emulator Smoke Test

on:
  push:
    paths:
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Download APK
        run: |
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/app-debug.apk" "https://github.com/poouo/MiyinMusic/releases/download/android-latest/app-debug.apk"

      - name: Launch emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/app-debug.apk"
            adb shell am start -W -n com.miyin.mobile/.MainActivity
            sleep 15
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-home.png"
            adb shell input swipe 540 1900 540 700 500
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-scrolled.png"
            adb shell input tap 880 2150
            sleep 5
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-search.png"
            adb logcat -d -t 1200 > "$GITHUB_WORKSPACE/logcat.txt"

      - name: Publish smoke artifacts
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-smoke
          name: Android smoke test
          prerelease: true
          overwrite_files: true
          files: |
            screenshot-home.png
            screenshot-scrolled.png
            screenshot-search.png
            logcat.txt
