name: Android Emulator Smoke Test

on:
  push:
    paths:
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK and emulator
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          curl -fL --retry 3 -o /tmp/gradle-8.13-bin.zip "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip"
          unzip -q /tmp/gradle-8.13-bin.zip -d /opt
          /opt/gradle-8.13/bin/gradle -p android assembleDebug --no-daemon

      - name: Launch emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -W -n com.miyin.mobile/.MainActivity
            sleep 15
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-home.png"

            adb shell input tap 880 2185
            sleep 4
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-library.png"

            adb shell input tap 900 330
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-login.png"

            adb logcat -d -t 1500 > "$GITHUB_WORKSPACE/logcat.txt"

      - name: Publish smoke artifacts
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-smoke
          name: Android smoke test
          prerelease: true
          overwrite_files: true
          files: |
            screenshot-home.png
            screenshot-library.png
            screenshot-login.png
            logcat.txt
