name: Build Windows client

on:
  push:
    branches: [main]
    paths:
      - "desktop-winui/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish native Windows client
        shell: pwsh
        run: |
          dotnet publish desktop-winui/MiYin.Desktop/MiYin.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -o desktop-winui/publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop-winui/PACKAGE-README.txt desktop-winui/publish/win-x64/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miyin-windows-x64
          path: desktop-winui/publish/win-x64/
