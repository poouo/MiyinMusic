name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Download Gradle
        run: |
          curl -fL --retry 3 -o /tmp/gradle-8.13-bin.zip "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip"
          unzip -q /tmp/gradle-8.13-bin.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../android-build.log

      - name: Show build failure
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|What went wrong|Could not resolve|Caused by:" android-build.log 2>/dev/null | head -60 | tr '\n' ' ' | cut -c1-9000)
          if [ -z "$MSG" ]; then MSG=$(tail -40 android-build.log 2>/dev/null | tr '\n' ' ' | cut -c1-5000); fi
          echo "::error title=Android build failed::$MSG"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log

      - name: Publish build log to release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-log
          name: Android build log
          prerelease: true
          overwrite_files: true
          files: android-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyin-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MiYin Android Debug
          prerelease: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
